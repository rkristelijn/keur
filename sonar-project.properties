# SonarCloud configuration for keur.
#
# keur is a deterministic commit-guard, not a maintainability analyzer
# (docs/design/scope.md). SonarCloud runs as a periodic quality audit, not a
# per-commit gate — keur itself is the per-commit gate.
#
# EXCLUSIONS: generated build artifacts and vendored/third-party code are not
# hand-written source and must not be analysed. Their "findings" (the logo
# string's escape-sequence style, the baked rule catalogue) are properties of the
# generator, not of editable code — fix the generator (scripts/gen-*.sh), never
# the generated file, so analysing the output is pointless.
sonar.projectKey=rkristelijn_keur
sonar.organization=rkristelijn

sonar.exclusions=\
  **/*_generated.cpp,\
  **/*_generated.h,\
  vendor/**,\
  eval/corpus/**,\
  rules/**,\
  .tmp/**
