name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Build keur on Linux, macOS and Windows, then run a post-compile e2e smoke
  # test of the essential subcommands. keur's core is the RE2 rule engine, so
  # every OS gets a full build with RE2 (via apt / brew / MSYS2). @see ADR-005.
  # ────────────────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      # Tiered CI by cost (ADR-041): a PR runs the cheap Linux build only — it
      # catches ~all logic/portability errors in seconds. The full, expensive
      # matrix (macOS = ~10x the minutes, Windows/MSYS2 slow to set up) runs on
      # main, where breadth matters before a release. Pushes to main therefore
      # still get every platform; PR iteration stays cheap.
      matrix:
        include: ${{ github.ref == 'refs/heads/main'
          && fromJSON('[{"os":"ubuntu-24.04","name":"linux-amd64"},{"os":"macos-14","name":"macos-arm64"},{"os":"windows-latest","name":"windows-amd64"}]')
          || fromJSON('[{"os":"ubuntu-24.04","name":"linux-amd64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ── Dependencies: RE2 + abseil per platform ──────────────────────────
      - name: Install RE2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libre2-dev libabsl-dev

      - name: Install RE2 (macOS)
        if: runner.os == 'macOS'
        run: brew install re2 abseil

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-re2
            mingw-w64-ucrt-x86_64-abseil-cpp

      # ── Build (POSIX shells on Linux/macOS) ──────────────────────────────
      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: make build
        working-directory: src/keur

      - name: Test (Linux/macOS)
        if: runner.os != 'Windows'
        run: make test
        working-directory: src/keur

      # ── Build on Windows via the MSYS2/UCRT64 toolchain ──────────────────
      # $(OS) == Windows_NT there, so the Makefile selects platform_win32.cpp.
      - name: Build (Windows / MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make build
        working-directory: src/keur

      # ── Post-compile e2e smoke test of the essential subcommands ─────────
      # This is the real "does the binary work" gate: version, policy, scan,
      # check. On Windows we run the same smoke through the MSYS2 shell.
      - name: Smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash tests/e2e/smoke.sh bin/keur

      - name: Smoke test (Windows / MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash tests/e2e/smoke.sh bin/keur.exe

      - name: Upload binary
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: keur-${{ matrix.name }}
          path: bin/keur
          retention-days: 5

  # ────────────────────────────────────────────────────────────────────────
  # 32-bit build: prove keur compiles AND runs on 32-bit ARM (armhf) — the
  # older Raspberry Pi target. Runs under QEMU emulation in an arm32v7 Debian
  # container (bookworm ships libre2-dev + abseil for armhf, so it is a full
  # build with the rule engine). The post-build smoke test is the proof that a
  # 32-bit binary behaves correctly (no word-size truncation). @see ADR-006.
  # ────────────────────────────────────────────────────────────────────────
  build-arm32:
    # QEMU-emulated armhf build — the slowest job (up to 40 min). Breadth, not
    # depth: run it on main (pre-release breadth) only, not on every PR push
    # (ADR-041 tiered CI, by cost).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (arm emulation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
        with:
          platforms: arm
      - name: Build + smoke (armhf under QEMU)
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/src" -w /src arm32v7/debian:bookworm \
            bash -c '
              set -e
              apt-get update
              apt-get install -y --no-install-recommends \
                g++ make libre2-dev libabsl-dev git ca-certificates
              # Confirm we really are 32-bit before building.
              echo "target word size: $(getconf LONG_BIT)-bit  ($(uname -m))"
              make -C src/keur build
              file bin/keur || true
              git config --global --add safe.directory /src
              bash tests/e2e/smoke.sh bin/keur
            '

  # ────────────────────────────────────────────────────────────────────────
  # Dogfood: keur gates its OWN repo the way it gates a user's.
  #
  #   1. Internal architecture + portability rules over src/keur (drift gate).
  #   2. The real user gate: `keur check` over the actual diff of this PR/push,
  #      exactly like the pre-commit / pre-push hook does locally. keur reads
  #      `git diff --cached`, so we stage the diff by resetting the index to the
  #      base (PR merge-base, or HEAD^ on a push) — the changes then appear as
  #      staged files and keur applies the full policy. Exit 1 (BLOCK) fails CI.
  #
  # Runs on Linux only.
  # ────────────────────────────────────────────────────────────────────────
  dogfood:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history to compute the base for the diff gate
      - name: Install RE2
        run: |
          sudo apt-get update
          sudo apt-get install -y libre2-dev libabsl-dev clang-tidy
      - name: Build keur
        run: make build
        working-directory: src/keur
      - name: Self-check (architecture — I/O only in adapters)
        run: bash tests/e2e/test_selfcheck.sh bin/keur
      - name: Self-check (portability — OS code only in common/)
        run: bash tests/e2e/test_portability.sh bin/keur

      # Unused #include check (clang-tidy misc-include-cleaner) over the test TUs.
      - name: Self-check (no unused includes in tests)
        run: make lint-includes
        working-directory: src/keur

      # The ADR index (docs/adr/README.md) is generated from the ADR files;
      # fail if someone added/renamed an ADR without regenerating it.
      - name: Self-check (ADR index is in sync)
        run: bash scripts/gen-adr-index.sh --check

      # ── The real gate: keur check over this change's own diff ────────────
      # Stage the diff against its base, then run the hook's command verbatim.
      - name: Gate own diff (keur check, pre-commit + pre-push)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Resolve the base to diff against:
          #   - PR:   the merge-base with the target branch (base.sha)
          #   - push: the commit before this push (HEAD^, if it exists)
          if [ -n "${BASE_SHA:-}" ]; then
            base="$(git merge-base "$BASE_SHA" HEAD)"
          elif git rev-parse --verify -q HEAD^ >/dev/null; then
            base="$(git rev-parse HEAD^)"
          else
            echo "No base commit to diff against (root commit) — nothing to gate."
            exit 0
          fi
          echo "Gating diff: ${base}..HEAD"
          # Move the index to the base so this change's files show up as staged;
          # the worktree stays at HEAD. keur check reads git diff --cached.
          git reset --soft "$base"
          echo "Staged files keur will gate:"
          git diff --cached --name-only --diff-filter=ACM | sed 's/^/  /'
          bin/keur check --tier pre-commit
          bin/keur check --tier pre-push
