# keur.toml — KEUR configuration
#
# Resolution order (later overrides earlier):
#   1. built-in defaults
#   2. ~/.config/keur/keur.toml        (global)
#   3. <repo>/keur.toml                (repo)
#   4. <dir>/.keur.toml                (directory-local)
#
# Every value here is a documented default. Nothing is hardcoded in the engine.

[project]
name = "keur"
version = "0.1.0"

# ─────────────────────────────────────────────────────────────────────────────
# Tiers — what runs where. Keep pre-commit fast; push heavier work down the line.
# ─────────────────────────────────────────────────────────────────────────────
[tiers.pre-commit]
budget-ms = 3000
# Fast, deterministic only. keur's own RE2 engine over the staged diff — works
# with NO external tools installed (ADR-002/ADR-066). External scanners are
# opt-in: install the tool, then add it here. e.g.:
#   scanners = ["gitleaks", "keur-rules"]
scanners = ["keur-rules"]
ai = false

[tiers.pre-push]
budget-ms = 30000
# Opt-in corroboration for push: install the tools, then uncomment. e.g.:
#   scanners = ["gitleaks", "trufflehog", "trivy", "semgrep", "checkov", "keur-rules"]
scanners = ["keur-rules"]
ai = "optional"                                  # off | optional | on

[tiers.ci]
budget-ms = 0                                    # 0 = unlimited
# Opt-in full set incl. second-source corroboration. e.g.:
#   scanners = ["gitleaks", "trufflehog", "presidio", "trivy", "grype", "osv-scanner", "semgrep", "checkov", "tfsec", "keur-rules"]
scanners = ["keur-rules"]
ai = "on"

# ─────────────────────────────────────────────────────────────────────────────
# Scanners — each is an evidence source (a thin adapter over PROVEN tooling).
# `bin` is resolved on PATH; missing tools are skipped gracefully (never block).
# base-confidence is the starting evidence strength before calibration.
# Corroboration: tools in the same `group` that agree on a fingerprint raise
# confidence (see [policy].corroboration-bonus). KEUR's own rule engine is a
# gap-filler for what these proven tools don't cover — never the primary layer.
# Full inventory + rationale: docs/design/proven-baseline.md
# ─────────────────────────────────────────────────────────────────────────────

# — Secrets (2 independent tools) —
[scanners.gitleaks]
bin = "gitleaks"
group = "secrets"
base-confidence = 0.99
deterministic = true
default-action = "block"

[scanners.trufflehog]
bin = "trufflehog"
group = "secrets"
base-confidence = 0.99          # can VERIFY a secret is live → strongest evidence
deterministic = true
default-action = "block"

# — Dependencies / SBOM / CVE (3 independent tools) —
[scanners.trivy]
bin = "trivy"
group = "deps"
base-confidence = 0.95
deterministic = true
default-action = "warn"

[scanners.grype]
bin = "grype"
group = "deps"
base-confidence = 0.90
deterministic = true
default-action = "warn"

[scanners.osv-scanner]
bin = "osv-scanner"
group = "deps"
base-confidence = 0.90
deterministic = true
default-action = "warn"

[scanners.syft]
bin = "syft"
group = "sbom"
role = "support"                # generates SBOM consumed by grype/trivy

# — SAST (code patterns) —
[scanners.semgrep]
bin = "semgrep"
group = "sast"
base-confidence = 0.80
deterministic = true
default-action = "warn"

# — IaC (2 independent tools) —
[scanners.checkov]
bin = "checkov"
group = "iac"
base-confidence = 0.85
deterministic = true
default-action = "warn"

[scanners.tfsec]
bin = "tfsec"
group = "iac"
base-confidence = 0.85
deterministic = true
default-action = "warn"

# — PII / sensitive data —
[scanners.presidio]
enabled = false                 # optional higher-fidelity PII (local venv)
group = "pii"
base-confidence = 0.75
role = "evidence"

# — KEUR's own rule engine: GAP-FILLER ONLY (domain patterns no tool covers) —
[scanners.keur-rules]
bin = "keur-rules"              # built-in engine over rules/**/*.rule
base-confidence = 0.60
deterministic = true
default-action = "warn"

# — Evidence-only sources (not gates; corroborate + feed the evaluator) —
[scanners.sonar]
enabled = false
base-confidence = 0.80
role = "evidence"

[scanners.coderabbit]
enabled = false
base-confidence = 0.70
role = "evidence"

# ─────────────────────────────────────────────────────────────────────────────
# Policy — how evidence becomes a verdict. Weights are explicit + stable.
# ─────────────────────────────────────────────────────────────────────────────
[policy]
# Verdict thresholds on calibrated confidence (0..1).
block-at = 0.85            # >= block-at and a blocking source → BLOCK
warn-at = 0.50             # >= warn-at → WARN
# below warn-at → PASS (still logged)

# Corroboration bonus when N independent tools agree on the same fingerprint.
corroboration-bonus = 0.10
corroboration-cap = 0.99

# Hard rules that override confidence (a live secret always blocks).
block-categories = ["secret"]
never-block-categories = []

# ─────────────────────────────────────────────────────────────────────────────
# AI escalation (optional). Ollama proposes/classifies; it never sets the verdict.
# ─────────────────────────────────────────────────────────────────────────────
[ai]
provider = "ollama"
model = "qwen2.5-coder"
endpoint = "http://localhost:11434"
# Only escalate findings whose confidence lands in the ambiguous band.
escalate-band-low = 0.40
escalate-band-high = 0.75
timeout-ms = 10000

# ─────────────────────────────────────────────────────────────────────────────
# Hooks
# ─────────────────────────────────────────────────────────────────────────────
[hooks]
pre-commit = true
pre-push = true
block-commit-on-main = true

# ─────────────────────────────────────────────────────────────────────────────
# Optimiser (laboratory loop) — safety controls. See docs/design/evaluator.md.
# ─────────────────────────────────────────────────────────────────────────────
[optimiser]
enabled = false
weight-precision = 0.45
weight-recall = 0.35
weight-regression-safety = 0.20
max-iterations = 100
max-runtime-min = 60
convergence-no-improve = 10
convergence-epsilon = 0.002
